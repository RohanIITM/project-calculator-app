<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5Afl6Tk0JfVsRS2QF5FZ0" crossorigin="anonymous">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
        }
        .calculator {
            padding: 1rem;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: #fff;
        }
        .screen {
            width: 100%;
            text-align: right;
            margin-bottom: 1rem;
            padding: 10px;
            font-size: 2rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" class="screen" id="screen" readonly>
    <div class="btn-group">
        <button class="btn btn-light" onclick="appendNumber('7')">7</button>
        <button class="btn btn-light" onclick="appendNumber('8')">8</button>
        <button class="btn btn-light" onclick="appendNumber('9')">9</button>
        <button class="btn btn-warning" onclick="setOperation('/')">/</button>
    </div>
    <div class="btn-group">
        <button class="btn btn-light" onclick="appendNumber('4')">4</button>
        <button class="btn btn-light" onclick="appendNumber('5')">5</button>
        <button class="btn btn-light" onclick="appendNumber('6')">6</button>
        <button class="btn btn-warning" onclick="setOperation('*')">*</button>
    </div>
    <div class="btn-group">
        <button class="btn btn-light" onclick="appendNumber('1')">1</button>
        <button class="btn btn-light" onclick="appendNumber('2')">2</button>
        <button class="btn btn-light" onclick="appendNumber('3')">3</button>
        <button class="btn btn-warning" onclick="setOperation('-')">-</button>
    </div>
    <div class="btn-group">
        <button class="btn btn-light" onclick="appendNumber('0')">0</button>
        <button class="btn btn-light" onclick="appendNumber('.')">.</button>
        <button class="btn btn-success" onclick="calculate()">=</button>
        <button class="btn btn-warning" onclick="setOperation('+')">+</button>
    </div>
    <div class="btn-group">
        <button class="btn btn-secondary" onclick="clearScreen()">C</button>
    </div>
</div>

<script>
    let currentNumber = '';
    let previousNumber = '';
    let operation = '';

    function appendNumber(number) {
        currentNumber += number;
        updateScreen();
    }

    function setOperation(op) {
        if (currentNumber === '') return;
        if (previousNumber !== '') {
            calculate();
        }
        operation = op;
        previousNumber = currentNumber;
        currentNumber = '';
    }

    function calculate() {
        let result;
        const prev = parseFloat(previousNumber);
        const current = parseFloat(currentNumber);
        switch (operation) {
            case '+':
                result = prev + current;
                break;
            case '-':
                result = prev - current;
                break;
            case '*':
                result = prev * current;
                break;
            case '/':
                result = prev / current;
                break;
            default:
                return;
        }
        currentNumber = result;
        operation = '';
        previousNumber = '';
        updateScreen();
    }

    function updateScreen() {
        document.getElementById('screen').value = currentNumber;
    }

    function clearScreen() {
        currentNumber = '';
        previousNumber = '';
        operation = '';
        updateScreen();
    }
</script>

<script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.bundle.min.js" integrity="sha384-ho+pjII6LrPBlC4+6SRFWLyR7F3U1tBw5lE4L8jnTRF4Z3abtZASzi0EEW5bsF3d" crossorigin="anonymous"></script>
</body>
</html>
